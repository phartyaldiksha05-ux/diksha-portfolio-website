<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diksha Phartyal | Generative AI & Backend Engineer</title>
<meta name="description" content="Portfolio of Diksha Phartyal, MCA graduate building RAG chatbots, LLM apps and FastAPI backends. Ask the assistant about her projects, experience and certificates.">
<meta property="og:title" content="Diksha Phartyal | Generative AI & Backend Engineer">
<meta property="og:description" content="Ask my portfolio anything: projects, experience, skills, certificates.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://diksha-portfolio-website-omega.vercel.app">
<meta property="og:image" content="https://diksha-portfolio-website-omega.vercel.app/assets/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECE8F7;--ink:#1D1A3F;--mute:#5D5985;--card:#fff;--line:#D6CFEC;--acc:#F2B632;--link:#4433C4}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
a{color:var(--link);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;height:100dvh;max-width:1180px;margin:0 auto}
.me{padding:32px 24px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line)}
.av{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:24px}
.me h1{font-size:28px;line-height:1.1;font-weight:800}
.role{color:var(--mute)}
.open{font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.open i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2E9E62;margin-right:8px}
.links{display:flex;flex-direction:column;gap:6px;font-weight:600}
.chat{display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow-y:auto;padding:28px 24px 12px;display:flex;flex-direction:column;gap:14px}
.m{max-width:min(640px,92%);padding:12px 16px;border-radius:18px;animation:in .25s ease-out}
.bot{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.usr{background:var(--acc);border-top-right-radius:4px;align-self:flex-end;font-weight:600}
.m p+p,.m p+.card,.m .card+.card,.m .card+p{margin-top:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#FBFAFE}
.card h3{font-size:17px;font-weight:800;line-height:1.25}
.card .sub{color:var(--mute);font-size:14px}
.card p{font-size:15px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{font-size:12.5px;background:#E6E1F6;border-radius:99px;padding:2px 10px}
.acts{display:flex;gap:16px;margin-top:8px;font-weight:600;font-size:15px}
.certs a{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);padding:8px 0}
.certs a+a{border-top:1px solid var(--line)}
.certs img{width:84px;height:58px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line);flex:none}
.certs b{display:block;font-size:15px;line-height:1.25}
.certs small{color:var(--mute)}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.5}}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.dock{padding:8px 24px 16px;border-top:1px solid var(--line);background:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips button{flex:none;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer}
.chips button:hover{border-color:var(--ink)}
form{display:flex;gap:8px}
input{flex:1;font:inherit;padding:12px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
form button{font:inherit;font-weight:800;border:0;border-radius:99px;padding:0 22px;background:var(--ink);color:#fff;cursor:pointer}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
@media(max-width:820px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 .me{flex-direction:row;align-items:center;padding:12px 16px;gap:12px;border:0;border-bottom:1px solid var(--line)}
 .av{width:44px;height:44px;font-size:17px;flex:none}.me h1{font-size:20px}
 .role{font-size:14px}
 .open,.links{display:none}
 #log{padding:16px 14px 8px}.dock{padding:8px 14px 14px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
 <aside class="me">
  <div class="av" aria-hidden="true">DP</div>
  <div><h1>Diksha Phartyal</h1><p class="role">Generative AI & Backend Engineer</p></div>
  <p class="open"><i></i>Open to AI/ML internships and Generative AI roles</p>
  <nav class="links" aria-label="Links">
   <a href="resume.pdf" target="_blank" rel="noopener">Resume (PDF)</a>
   <a href="https://github.com/phartyaldiksha05-ux" target="_blank" rel="noopener">GitHub</a>
   <a href="https://www.linkedin.com/in/diksha-phartyal-818357354/" target="_blank" rel="noopener">LinkedIn</a>
   <a href="mailto:phartyaldiksha05@gmail.com">phartyaldiksha05@gmail.com</a>
  </nav>
 </aside>
 <main class="chat">
  <div id="log" role="log" aria-live="polite"></div>
  <div class="dock">
   <div class="chips" id="chips"></div>
   <form id="f"><input id="q" type="text" placeholder="Ask about my projects, skills, experience..." aria-label="Ask a question" autocomplete="off"><button>Send</button></form>
   <p class="note">Answers are written from Diksha's real work and matched to your question. This is not a live AI model.</p>
  </div>
 </main>
</div>
<noscript><p style="padding:16px">Diksha Phartyal, Generative AI & Backend Engineer. <a href="https://github.com/phartyaldiksha05-ux">GitHub</a>, <a href="https://www.linkedin.com/in/diksha-phartyal-818357354/">LinkedIn</a>, <a href="resume.pdf">Resume</a>. Enable JavaScript to chat with this portfolio.</p></noscript>
<script>
const L=(u,t)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
const P=[
{n:'Multilingual RAG Chatbot for GBPIET',d:'Live on the official college website. Answers student questions in Hindi, English, Garhwali and Kumauni using hybrid dense + sparse search over 100+ web pages.',t:['FastAPI','LangChain','Qdrant','Groq API','React','PostgreSQL'],live:'https://gbpiet.ac.in',code:'https://github.com/phartyaldiksha05-ux/Multilingual-college-chatbot'},
{n:'Meetwise AI: HR Interview Assistant',d:'A hiring workspace that reads PDF resumes, writes candidate briefings and interview questions, schedules interviews with reminders and summarizes HR feedback.',t:['React','FastAPI','PostgreSQL','Alembic','Docker'],live:'https://hr-interview-assistant-six.vercel.app/',code:'https://github.com/phartyaldiksha05-ux/hr-interview-assistant'},
{n:'AI Interview Agent',d:'Built for ViCoDathon 2026 by AB Talks. An adaptive, voice-enabled technical interview that asks questions based on what a candidate built, skipped and struggled with in the cohort.',t:['Voice input','Adaptive follow-ups','48-hour hackathon build'],live:'https://ai-interview-agent-delta-rust.vercel.app/'},
{n:'Agentic Data Analyst',d:'An AI-powered tool that automates data analysis. Built for my UptoSkills internship.',t:['AI agents','Data analysis'],live:'https://agentic-data-analyst-1-nxlf.onrender.com/'}];
const proj=p=>`<div class="card"><h3>${p.n}</h3><p>${p.d}</p><div class="tags">${p.t.map(x=>`<span>${x}</span>`).join('')}</div><div class="acts">${L(p.live,'Live demo')}${p.code?L(p.code,'Source code'):''}</div></div>`;
const job=(r,o,w,d)=>`<div class="card"><h3>${r}</h3><div class="sub">${o} · ${w}</div><p>${d}</p></div>`;
const C=[['Certificate of Appreciation, AI Chatbot Development','GBPIET · May 2026','gbpiet-chatbot-appreciation'],['Emerging Technologies Internship','Edunet Foundation, AICTE & IBM SkillsBuild · Jun 2026','edunet-emerging-tech'],['Internship Completion, Team Lead','UptoSkills · May 2026','uptoskills-internship'],['Certificate of Appreciation, Backend Development','Prodesk IT & Engineering Services · Jul 2025','prodesk-backend-internship'],['ViCoDathon 2026, Participation','AB Talks, India\'s AI Vibe Coding Hackathon · Aug 2026','ab-talks-vicodathon'],['Introduction to Artificial Intelligence','Infosys Springboard · Jun 2025','infosys-ai-course']];
const A={
hi:()=>`<p>Hi, I'm Diksha's portfolio assistant. Pick a topic below or type a question.</p><p>Short version: Diksha is an MCA graduate who builds RAG chatbots, LLM apps and FastAPI backends. Her chatbot is live on the GBPIET college website.</p>`,
about:()=>`<p>Diksha Phartyal is a recent MCA graduate (GBPIET, CGPA 8.28) from Ramnagar, Uttarakhand. She builds Generative AI applications: RAG pipelines, LLM integrations, vector search and the FastAPI backends behind them.</p><p>She is looking for AI/ML internships and Generative AI Engineer roles.</p>`,
projects:()=>`<p>Here are four things she has built and deployed:</p>${P.map(proj).join('')}<p>More ML and data projects are on ${L('https://github.com/phartyaldiksha05-ux','GitHub')}.</p>`,
p0:()=>proj(P[0]),p1:()=>proj(P[1]),p2:()=>proj(P[2]),p3:()=>proj(P[3]),
exp:()=>job('Emerging Technologies Intern','Edunet Foundation (AICTE & IBM SkillsBuild)','May to Jun 2026','4-week internship in Agentic AI, Cyber Security and Quantum Computing on IBM Cloud. Built an AI and Cloud Computing project.')+job('Strategy, Consulting & Research Intern (Team Lead)','UptoSkills','Jan to May 2026','Led a 4-member team to deliver 3+ consulting and market analysis reports across 5+ industry sectors on schedule.')+job('Backend Development Intern','Prodesk IT & Engineering Services','Jun to Jul 2025','Built and tested 5+ REST API endpoints in Python with request validation and modular processing. Earned a Certificate of Appreciation.'),
skills:()=>`<div class="card"><h3>Generative AI</h3><p>LLMs, RAG, LangChain, prompt engineering, Groq API, Qdrant, FAISS, hybrid search</p></div><div class="card"><h3>Backend</h3><p>Python, FastAPI, Flask, REST APIs, SQLAlchemy, PostgreSQL, MongoDB, MySQL</p></div><div class="card"><h3>ML and data</h3><p>Scikit-learn, Pandas, NumPy, feature engineering, data analysis, SQL</p></div><div class="card"><h3>Frontend and deployment</h3><p>React, Vite, Docker, Git, CI/CD, Vercel, Render, Hugging Face Spaces</p></div>`,
certs:()=>`<p>Six certificates. Tap one to open the original.</p><div class="card certs">${C.map(c=>`<a href="assets/certificates/${c[2]}.png" target="_blank" rel="noopener"><img loading="lazy" src="assets/certificates/${c[2]}.png" alt=""><span><b>${c[0]}</b><small>${c[1]}</small></span></a>`).join('')}</div>`,
edu:()=>job('Master of Computer Applications','GBPIET, Pauri Garhwal','2024 to 2026','CGPA 8.28')+job('Bachelor of Science','Kumaun University, Nainital','2021 to 2024','CGPA 6.07'),
contact:()=>`<p>The quickest way is email: <a href="mailto:phartyaldiksha05@gmail.com">phartyaldiksha05@gmail.com</a></p><p>${L('https://www.linkedin.com/in/diksha-phartyal-818357354/','LinkedIn')} · ${L('https://github.com/phartyaldiksha05-ux','GitHub')} · <a href="resume.pdf" target="_blank" rel="noopener">Resume (PDF)</a></p>`,
miss:()=>`<p>I only know Diksha's work, so I can't answer that one. Try asking about her projects, experience, skills, certificates or how to contact her.</p>`};
const R=[[/gbpiet|college|multilingual|garhwali|kumauni|rag chat/,'p0'],[/meetwise|hr |hiring|recruit/,'p1'],[/interview agent|hackathon|vicodathon|ab ?talks|voice/,'p2'],[/data analyst|agentic|uptoskills project/,'p3'],[/project|built|build|work sample|portfolio|demo/,'projects'],[/experience|intern|job|employ|worked|company|edunet|prodesk|uptoskills/,'exp'],[/skill|tech|stack|tool|language|python|fastapi|langchain|know/,'skills'],[/certif|award|achiev|proof/,'certs'],[/educat|degree|mca|bsc|cgpa|college|study|university/,'edu'],[/contact|email|hire|reach|resume|cv|linkedin|github|phone|available/,'contact'],[/who|about|introduc|yourself|tell me|summary|hello|\bhi\b|hey/,'about']];
const log=document.getElementById('log'),q=document.getElementById('q');
const CH=[['What has she built?','projects'],['Work experience','exp'],['Tech skills','skills'],['Certificates','certs'],['Education','edu'],['Contact','contact']];
function add(cls,html,text){const d=document.createElement('div');d.className='m '+cls;text?d.textContent=text:d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function ask(label,key){add('usr','',label);const t=add('bot','<span class="dots"><span></span><span></span><span></span></span>');
 setTimeout(()=>{t.innerHTML=A[key]();log.scrollTop=log.scrollHeight},matchMedia('(prefers-reduced-motion:reduce)').matches?0:450)}
const chips=document.getElementById('chips');
CH.forEach(([l,k])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.onclick=()=>ask(l,k);chips.appendChild(b)});
document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=q.value.trim();if(!v)return;q.value='';const s=' '+v.toLowerCase()+' ';const hit=R.find(r=>r[0].test(s));ask(v,hit?hit[1]:'miss')};
add('bot',A.hi());
</script>
</body>
</html>
